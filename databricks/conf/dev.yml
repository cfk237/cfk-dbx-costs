targets:
  local:
    mode: development
    default: true
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/${bundle.name}/.bundle/${bundle.target}
    
    variables:
      catalog_env: dev
      job_schedule_status: "PAUSED"

    run_as:
      user_name: ${workspace.current_user.userName}

    permissions:
      - user_name: ${workspace.current_user.userName}
        level: CAN_MANAGE

  # The 'dev' target, for development purposes. This target is the default.
  dev:
    presets:
      tags:
        AppId: "${var.app_id}"
        dataproduct: "${var.data_product}"
        domain: "${var.domain}"
    mode: production
    default: true

    variables:
      catalog_env: dev
